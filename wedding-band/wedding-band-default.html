<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <meta property="og:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="iJewel3D Wedding Band Builder" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.22.0.js"></script>
    <!-- @ijewel3d/mini-viewer 0.6.17 — material schema v2, material variants,
         Modern Metals, inlays, overlays, and inside sleeves. -->
    <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.6.18/bundle.nowebgi.iife.js"></script>
  </head>
  <body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;">
    <!-- Relative path: the templates are served from a repository sub-path on
         GitHub Pages, so an absolute /-rooted URL would not resolve. -->
    <img src="./weddingbad-logo.svg" alt="Wedding Band Builder"
         style="position: fixed; top: 12px; left: 12px; height: 48px; z-index: 10000; opacity: 0.85; pointer-events: none;" />
    <div id="viewer" style="width: 100%; height: 100%;"></div>
    <script>
      /*
       * fileId is the published Wedding Band project's unique iJewel Drive ID.
       * In Drive, choose Share and copy the value between /files/ and /view.
       *
       * instance is the Drive basename. Standard accounts normally use
       * "drive"; enterprise accounts use the basename supplied by iJewel3D.
       *
       * Find the ID:
       * https://docs.ijewel3d.com/viewer/tutorial-embed-drive.html#find-the-model-id
       * API and instance details:
       * https://docs.ijewel3d.com/viewer/connect-to-drive.html#loading-a-specific-model-by-id-loadmodelbyid
       */
      const CONFIG = {
        // Boutique project. The same project can also drive the Panel layout.
        fileId: "E3j8eClwR7iWMFNmGi5HoQ",
        instance: "drive",
      };
      let viewer, matPlugin;

      //initialize viewer and load model
      ijewelViewer.loadModelById(
        CONFIG.fileId,
        CONFIG.instance,
        document.getElementById("viewer"),
        {
          showCard: false,
          showSwitchNode: false,
          showUiButtons: true,
          showConfigurator: false,
          showZoomButtons: false,
          enableZoom: true,
          hideWbbUi: new URLSearchParams(window.location.search).get("hideWbbUi") === "true",
        },
      );

      window.addEventListener("ijewel-viewer-ready", async ({ detail }) => {
        viewer = detail.viewer;
      });
    </script>
  </body>
</html>
