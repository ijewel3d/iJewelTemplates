<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.22.0.js"></script>
    <!-- @ijewel3d/mini-viewer 0.6.12 — first release with Wedding Band Builder
     Phase 2 (multi-ring compilations, side stones, free stones, design and
     separation grooves, wavy/diagonal divisions, theming). -->
  <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.6.12/bundle.nowebgi.iife.js"></script>
  </head>
  <body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;">
    <div id="viewer" style="width: 100%; height: 100%;"></div>
    <script>
      /*
       * fileId is the published Wedding Band project's unique iJewel Drive ID.
       * In Drive, choose Share and copy the value between /files/ and /view.
       *
       * instance is the Drive basename. Standard accounts normally use
       * "drive"; enterprise accounts use the basename supplied by iJewel3D.
       *
       * Find the ID:
       * https://docs.ijewel3d.com/viewer/tutorial-embed-drive.html#find-the-model-id
       * API and instance details:
       * https://docs.ijewel3d.com/viewer/connect-to-drive.html#loading-a-specific-model-by-id-loadmodelbyid
       */
      const CONFIG = {
        fileId: "WsF9jzAESde9Jij21ef8cA",
        instance: "demo-weur",
      };
      let viewer, matPlugin;

      //initialize viewer and load model
      ijewelViewer.loadModelById(
        CONFIG.fileId,
        CONFIG.instance,
        document.getElementById("viewer"),
        {
          showCard: false,
          showSwitchNode: false,
          showUiButtons: true,
          showConfigurator: false,
          showZoomButtons: false,
          enableZoom: true,
          hideWbbUi: false,
        },
      );

      window.addEventListener("ijewel-viewer-ready", async ({ detail }) => {
        viewer = detail.viewer;
      });
    </script>
  </body>
</html>
