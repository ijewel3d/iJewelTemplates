<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Band Builder — iJewel3d</title>
  <meta property="og:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta property="og:image:alt" content="iJewel3D Wedding Band Builder" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Relative path: the templates are served from a repository sub-path on
       GitHub Pages, so an absolute /-rooted URL would not resolve. -->
  <img src="./weddingbad-logo.svg" alt="Wedding Band Builder"
       style="position:fixed;top:12px;left:12px;height:48px;z-index:10000;opacity:.85;pointer-events:none">
  <div id="root"></div>
  <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.22.0.js"></script>
  <!-- @ijewel3d/mini-viewer 0.6.17 — material schema v2, material variants,
       Modern Metals, inlays, overlays, and inside sleeves. -->
  <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.6.17/bundle.nowebgi.iife.js"></script>
  <script>
    /*
     * This self-hosted-project variant loads a JSON URL directly, so it does
     * not use loadModelById's fileId or instance arguments.
     *
     * For Drive loading, fileId is the published project's unique Drive ID and
     * instance is the Drive basename (normally "drive", or the enterprise
     * basename supplied by iJewel3D):
     * https://docs.ijewel3d.com/viewer/connect-to-drive.html#loading-a-specific-model-by-id-loadmodelbyid
     */
    const PROJECT_URL = './wedding_band_project.json';

    (async () => {
      const root = document.getElementById('root');
      const project = await fetch(PROJECT_URL).then(r => r.json());

      // Mobile: bump model scale by 20%
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (isMobile) {
        const wbb = project?.plugins?.WeddingBandBuilder;
        if (wbb?.defaults) {
          wbb.defaults.rootScale = (wbb.defaults.rootScale ?? 0.1) * 1.2;
        }
      }

      const viewerOptions = {
        showCard: false,
        showSwitchNode: false,
        showUiButtons: true,
        showConfigurator: false,
        showZoomButtons: false,
        enableZoom: true,
        hideWbbUi: false
      };

      if (window.ijewelViewer?.Viewer) {
        new window.ijewelViewer.Viewer(root, project, viewerOptions);
      } else {
        root.innerHTML = '<div style="color:red;padding:20px;font-family:monospace">mini-viewer IIFE bundle failed to load.</div>';
      }
    })();
  </script>
</body>
</html>
