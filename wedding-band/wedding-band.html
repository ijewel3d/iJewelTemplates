<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Band Builder — iJewel3d</title>
  <meta property="og:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta property="og:image:alt" content="iJewel3D Wedding Band Builder" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://docs.ijewel3d.com/assets/images/og-wbb.webp" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Relative path: the templates are served from a repository sub-path on
       GitHub Pages, so an absolute /-rooted URL would not resolve. -->
  <img src="./weddingbad-logo.svg" alt="Wedding Band Builder"
       style="position:fixed;top:12px;left:12px;height:48px;z-index:10000;opacity:.85;pointer-events:none">
  <div id="root"></div>
  <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.22.0.js"></script>
  <!-- @ijewel3d/mini-viewer 0.6.17 — material schema v2, material variants,
       Modern Metals, inlays, overlays, and inside sleeves. -->
  <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.6.18/bundle.nowebgi.iife.js"></script>
  <script>
    /*
     * The Boutique and Panel layouts share one hosted project. This entrypoint
     * selects Panel after the Wedding Band controller becomes ready.
     *
     * fileId is the published project's unique Drive ID and instance is the
     * Drive basename:
     * https://docs.ijewel3d.com/viewer/connect-to-drive.html#loading-a-specific-model-by-id-loadmodelbyid
     */
    const CONFIG = {
      fileId: 'E3j8eClwR7iWMFNmGi5HoQ',
      instance: 'drive',
      layout: 'panel',
    };

    const root = document.getElementById('root');

    window.addEventListener('ijewel-viewer-ready', async ({ detail }) => {
      try {
        const plugin = detail.viewer.getPluginByType('WeddingBandBuilder');
        const controller = await plugin?.whenReady();
        controller?.setLayout(CONFIG.layout);
      } catch (error) {
        root.innerHTML = `<div style="color:red;padding:20px;font-family:monospace">Unable to select Panel layout: ${error.message}</div>`;
      }
    });

    try {
      ijewelViewer.loadModelById(CONFIG.fileId, CONFIG.instance, root, {
        showCard: false,
        showSwitchNode: false,
        showUiButtons: true,
        showConfigurator: false,
        showZoomButtons: false,
        enableZoom: true,
        hideWbbUi: false,
      });
    } catch (error) {
      root.innerHTML = `<div style="color:red;padding:20px;font-family:monospace">Unable to start Panel layout: ${error.message}</div>`;
    }
  </script>
</body>
</html>
