<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iJewel3D Advanced Ring Configurator</title>
    <link rel="stylesheet" href="assets/style-v4.css">
    <link rel="stylesheet" href="assets/gem-size-dropdown.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <!-- ─── HEADER ──────────────────────────────────────────── -->

                    <polygon points="14,7.5 22,7.5 28.5,14 28.5,22 22,28.5 14,28.5 7.5,22 7.5,14" />
                </svg>
            </span>
            <span>YOUR BRAND</span>
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="btn-account" type="button" aria-label="Account">

                <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
                    <g transform="translate(4 12.205)"><path d="M 8.205 0.842 L 7.795 0.842 C 4.24 0.842 1.308 3.51 0.893 6.953 L 15.107 6.953 C 14.692 3.51 11.76 0.842 8.205 0.842 Z M 15.955 6.953 C 15.535 3.044 12.226 0 8.205 0 L 7.795 0 C 3.774 0 0.465 3.044 0.045 6.953 C 0.015 7.229 0 7.51 0 7.795 L 16 7.795 C 16 7.51 15.985 7.229 15.955 6.953 Z" /></g>

                </svg>
            </button>
            <button class="icon-btn" id="btn-wishlist" type="button" aria-label="Wishlist">

                </svg>
            </button>
            <button class="icon-btn" id="btn-bag" type="button" aria-label="Bag">
                <!-- figma: bag -->
                <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
                    <g transform="translate(4 8.324)"><path d="M 14.246 0.889 L 0.889 0.889 L 0.889 10.787 L 14.246 10.787 L 14.246 0.889 Z M 0 0 L 0 11.676 L 15.135 11.676 L 15.135 0 L 0 0 Z" /></g>
                    <g transform="translate(7.892 4)"><path d="M 0 9.514 L 0.889 9.514 L 0.889 3.676 C 0.889 2.137 2.137 0.889 3.676 0.889 C 5.215 0.889 6.462 2.137 6.462 3.676 L 6.462 9.514 L 7.351 9.514 L 7.351 3.676 C 7.351 1.646 5.706 0 3.676 0 C 1.646 0 0 1.646 0 3.676 L 0 9.514 Z" /></g>
                </svg>

        </div>
    </header>

    <!-- ─── MAIN GRID ───────────────────────────────────────── -->
    <main class="app-main">
        <!-- ─── VIEWER PANE ─────────────────────────────────── -->
        <section class="viewer-pane">
            <!-- Fullscreen-only close button. Hidden by default; the
                 `.viewer-pane:fullscreen .fullscreen-close` rule in
                 style-v4.css reveals it while the pane is the active
                 fullscreen element. -->
            <button class="fullscreen-close" id="btn-fullscreen-close" type="button" aria-label="Exit fullscreen" data-tooltip="Exit fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M6 6 L18 18 M18 6 L6 18" />
                </svg>
            </button>

            <!-- Try-On overlay controls. Hidden by default; the
                 `body.tryon-active .tryon-controls` rule in style-v4.css
                 reveals them while AR try-on is running. Buttons mirror
                 the web-vto reference: `flipCamera()` swaps front/back,
                 the X exits the session via `toggleTryOn()` (which calls
                 `arPlugin.stop()` and clears the body lockdown class).
                 `data-tooltip` powers the CSS hover popover (see
                 `[data-tooltip]:hover::after` in style-v4.css). -->
            <div class="tryon-controls" id="tryon-controls" aria-hidden="true">
                <button class="tryon-ctrl-btn" id="btn-tryon-flip" type="button" aria-label="Flip camera" data-tooltip="Flip camera">
                    <!-- Lucide `switch-camera` — two interlocking arrows
                         around a camera body. Reads as "switch direction"
                         more clearly than the previous custom glyph. -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>
                        <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/>
                        <circle cx="12" cy="12" r="3"/>
                        <path d="m18 22-3-3 3-3"/>
                        <path d="m6 2 3 3-3 3"/>
                    </svg>
                </button>
                <button class="tryon-ctrl-btn" id="btn-tryon-exit" type="button" aria-label="Exit Try-On" data-tooltip="Exit Try-On">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M6 6 L18 18 M18 6 L6 18" />
                    </svg>
                </button>
            </div>

            <!-- Canvas area (logo + 3D viewer + heart overlay) sits in its own
                 flex row so the action bar can live below it instead of being
                 absolutely positioned on top of the canvas. -->
            <div class="viewer-canvas">
                <img src="../logo-ij-c.png" alt="iJewel3D" class="viewer-logo">

                <div id="viewer-container"></div>
            </div>

                            <path d="M 11.541 23.333 C 10.073 23.333 8.7 22.963 7.421 22.223 C 6.143 21.483 5.111 20.452 4.326 19.132 L 0 11.823 L 0.344 11.462 C 0.548 11.242 0.791 11.118 1.074 11.089 C 1.356 11.06 1.616 11.13 1.852 11.301 L 6.34 14.426 L 6.34 2.991 C 6.34 2.836 6.394 2.698 6.503 2.576 C 6.612 2.454 6.748 2.393 6.909 2.393 C 7.056 2.393 7.188 2.454 7.304 2.576 C 7.42 2.698 7.478 2.836 7.478 2.991 L 7.478 16.708 L 1.996 12.845 L 5.291 18.446 C 5.955 19.601 6.843 20.505 7.956 21.158 C 9.069 21.81 10.264 22.137 11.541 22.137 C 13.568 22.137 15.295 21.395 16.722 19.911 C 18.148 18.426 18.862 16.611 18.862 14.465 L 18.862 3.59 C 18.862 3.435 18.916 3.296 19.025 3.175 C 19.134 3.052 19.27 2.991 19.431 2.991 C 19.578 2.991 19.71 3.052 19.826 3.175 C 19.942 3.296 20 3.435 20 3.59 L 20 14.465 C 20 16.934 19.179 19.03 17.537 20.751 C 15.895 22.473 13.897 23.333 11.541 23.333 Z M 10.521 10.769 L 10.521 0.598 C 10.521 0.443 10.576 0.305 10.685 0.183 C 10.794 0.061 10.93 0 11.091 0 C 11.252 0 11.388 0.061 11.496 0.183 C 11.605 0.305 11.659 0.443 11.659 0.598 L 11.659 10.769 L 10.521 10.769 Z M 14.702 10.769 L 14.702 1.795 C 14.702 1.64 14.757 1.502 14.866 1.38 C 14.975 1.258 15.111 1.197 15.272 1.197 C 15.434 1.197 15.569 1.258 15.678 1.38 C 15.786 1.502 15.841 1.64 15.841 1.795 L 15.841 10.769 L 14.702 10.769 Z" />

                    <div class="group-body">

                        <!-- Head Type (nested) — first level of v3's

                            <div class="subgroup-header">
                                <span class="subgroup-title">Head Type</span>

                                </div>
                            </div>
                        </section>

                        <!-- Gem Shape (nested) -->
                        <section class="subgroup" data-subgroup="gem-shape">
                            <div class="subgroup-header">
                                <span class="subgroup-title">Gem Shape</span>
                            </div>
                            <div class="subgroup-body-inner">
                                <div class="field" data-field="shape">
                                    <div class="field-content">
                                        <div class="field-empty">Loading…</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Center Stone (nested) -->

                        <!-- Carat (inline row, not collapsible) -->

                            <div class="field-block field" data-field="size">

                                <div class="field-content">

                            </div>
                        </div>

                                        <div class="field-empty">Loading…</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Metal Colour (nested) -->
                        <section class="subgroup" data-subgroup="shank-metal">
                            <div class="subgroup-header">
                                <span class="subgroup-title">Metal Colour</span>
                            </div>
                            <div class="subgroup-body-inner">
                                <div class="field" data-field="shank-color">
                                    <div class="field-content">
                                        <div class="field-empty">Loading…</div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </section>

                <!-- ════════ BAND ════════ -->
                <section class="group" data-group="band">
                    <button class="group-header" type="button" aria-expanded="false">
                        <span class="group-title">Band</span>
                        <span class="toggle-icon" aria-hidden="true"></span>
                    </button>
                    <div class="group-body">

                        <!-- Band Thickness (nested) -->

                            </div>
                            <div class="subgroup-body-inner">
                                <div class="field">

                                        <div class="field-empty">Loading…</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Band Style (nested) — 2-column card grid with labels. -->

                            <div class="subgroup-header">
                                <span class="subgroup-title">Band Style</span>
                            </div>
                            <div class="subgroup-body-inner">
                                <div class="field" data-field="band-type">
                                    <div class="field-content">

            <!-- Exit -->

            </div>
        </aside>
    </main>

    <!-- Gem size dropdown component (shared) -->
    <script src="assets/gem-size-dropdown.js"></script>

    <!-- Local SVG library for diamond / gem shape swatches.
         Replaces the icons that ship with the WBB plugin so the swatch
         artwork stays consistent across projects. -->
    <script src="assets/shape-icons.js"></script>

    <!-- ── 3D runtime: webgi + web-vto ───────────────────────────────
         Loaded synchronously (no async/defer) so by the time the
         orchestrator script runs, webgi globals are on `window`, the
         alias `window.webgi = window` is set (web-vto resolves its peer
         deps through that namespace), and `window.ij_vto.RingTryonPlugin`
         is ready. Right after the web-vto bundle parses we call
         `RingTryonPlugin.preload()` (per web-vto/src/index.ts:59) so
         the MediaPipe hand_landmarker.task model + vision_wasm assets
         begin downloading on page load, well before the user clicks
         TryOn.

         mini-viewer is loaded later via `loadScript` from the
         orchestrator (the `nowebgi` variant — webgi is already on the
         page from the script tag above). -->
    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.22.0.js" crossorigin="anonymous"></script>
    <script>window.webgi = window;</script>
    <script src="https://releases.ijewel3d.com/libs/web-vto/0.1.11/web-vto.js" crossorigin="anonymous"></script>
    <script>
        try { window.ij_vto && window.ij_vto.RingTryonPlugin && window.ij_vto.RingTryonPlugin.preload(); }
        catch (e) { console.warn('[tryon] preload failed', e); }
    </script>

    <script>
        /* ===================================================================
           Ring Builder — orchestrator (v4)
           Preserves all configurator logic from v3; only chrome was redesigned.
           =================================================================== */
        (function () {
            'use strict';

            // ── DOM helpers ──────────────────────────────────────────────
            const $ = (s, c = document) => c.querySelector(s);
            const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
            const el = (tag, attrs = {}, kids = []) => {
                const n = document.createElement(tag);
                for (const [k, v] of Object.entries(attrs)) {
                    if (k === 'class') n.className = v;
                    else if (k === 'text') n.textContent = v;
                    else if (k.startsWith('data-')) n.setAttribute(k, v);
                    else n[k] = v;
                }
                for (const c of [].concat(kids)) {
                    if (c == null) continue;
                    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                }
                return n;
            };

            // ── Shape-icon helper ────────────────────────────────────────
            // Render the matching SVG from assets/shape-icons.js into the
            // swatch's `<div class="swatch-img">` wrapper. Returns true if
            // we found a local icon — callers should fall through to the
            // plugin-provided image (or the placeholder hatch) when false.
            function fillShapeIconInto(imgWrapEl, shapeKey) {
                if (typeof window.getShapeIcon !== 'function') return false;
                const svg = window.getShapeIcon(shapeKey);
                if (!svg) return false;
                imgWrapEl.innerHTML = svg;
                imgWrapEl.classList.add('has-local-svg');
                return true;
            }

            function fillHeadIconInto(imgWrapEl, headKey) {
                if (typeof window.getHeadIcon !== 'function') return false;
                const svg = window.getHeadIcon(headKey);
                if (!svg) return false;
                imgWrapEl.innerHTML = svg;
                imgWrapEl.classList.add('has-local-svg');
                return true;
            }

            // Resolve the best shape-icon key for a variation. Prefers the
            // `shape:` tag; otherwise tries variation.name / .title.
            function shapeKeyForVariation(variation) {
                const tags = parseTags(variation);
                return tags.shape || variation.name || variation.title || '';
            }

            // ── Accordion (top-level groups + nested subgroups) ──────────
            // Single-open behaviour: opening a group closes its siblings so
            // only one section's body is visible at a time. Subgroups follow
            // the same rule within their parent group.
            $$('.group-header').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.closest('.group');
                    const willOpen = !group.classList.contains('open');
                    if (willOpen) {
                        $$('.group').forEach(g => {
                            if (g !== group) {
                                g.classList.remove('open');
                                const hdr = g.querySelector('.group-header');
                                if (hdr) hdr.setAttribute('aria-expanded', 'false');
                            }
                        });
                    }
                    group.classList.toggle('open', willOpen);
                    btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                });
            });
            // Subgroups are static labels (no collapse) — the only divider
            // between them is the `.subgroup` `border-top`.

            // ── Swatch hover popover ─────────────────────────────────────
            // A single floating <div> portaled to <body>. CSS-only popovers
            // get clipped by `.subgroup-body { overflow: hidden }` (which
            // we need for the accordion animation), so we read the swatch's
            // label text and position the popover with fixed coords. Skips
            // band-style swatches — those keep their visible card caption.
            (function initSwatchPopover() {
                const pop = document.createElement('div');
                pop.className = 'swatch-popover';
                document.body.appendChild(pop);

                const TARGET = '.swatch, .color-swatch';
                const SKIP_PARENT = '[data-subgroup="band-style"]';
                let current = null;

                const placeAbove = (el) => {
                    const r = el.getBoundingClientRect();
                    pop.style.left = (r.left + r.width / 2) + 'px';
                    pop.style.top  = (r.top - 6) + 'px';
                };

                const show = (el) => {
                    const label = el.querySelector('.swatch-label, .color-label');
                    const text = label?.textContent?.trim();
                    if (!text) return;
                    pop.textContent = text;
                    placeAbove(el);
                    pop.classList.add('show');
                    current = el;
                };
                const hide = () => {
                    pop.classList.remove('show');
                    current = null;
                };

                const sidebar = document.querySelector('.sidebar');
                if (!sidebar) return;
                sidebar.addEventListener('mouseover', (e) => {
                    const t = e.target.closest(TARGET);
                    if (!t || t.closest(SKIP_PARENT)) return;
                    if (t !== current) show(t);
                });
                sidebar.addEventListener('mouseout', (e) => {
                    if (!current) return;
                    // Moving the pointer to ANY popoverable swatch — let the
                    // upcoming mouseover update content/position smoothly
                    // instead of flashing hide-then-show.
                    const nextSwatch = e.relatedTarget?.closest?.(TARGET);
                    if (nextSwatch && !nextSwatch.closest(SKIP_PARENT)) return;
                    hide();
                });
                // Reposition while open — covers sidebar scroll / window resize.
                const reposition = () => { if (current) placeAbove(current); };
                sidebar.addEventListener('scroll', reposition, { passive: true });
                window.addEventListener('scroll', reposition, { passive: true });
                window.addEventListener('resize', reposition);
            })();

            // ── Toast helper ─────────────────────────────────────────────
            // Single reusable toast pinned to the bottom of the viewport.
            function showToast(msg, ms = 2200) {
                let toast = document.getElementById('app-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'app-toast';
                    toast.className = 'app-toast';
                    document.body.appendChild(toast);
                }
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._t);
                toast._t = setTimeout(() => toast.classList.remove('show'), ms);
            }

            // ── Action-bar plugin actions ────────────────────────────────
            // The first thing we try is the matching iJewel/WebGI plugin.
            // If the plugin isn't available we fall back to browser/Three
            // primitives so the button still does something useful.

            // Copy the current URL to the clipboard and confirm via toast.
            async function shareLink() {
                const url = window.location.href;
                try {
                    if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(url);
                    } else {
                        // Older Safari / non-secure contexts fall back to a
                        // throwaway textarea + execCommand('copy').
                        const ta = document.createElement('textarea');
                        ta.value = url;
                        ta.setAttribute('readonly', '');
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                    }
                    showToast('Link copied to clipboard');
                } catch (e) {
                    console.warn('[share] clipboard write failed', e);
                    showToast("Couldn't copy link");
                }
            }

            // Enter/exit fullscreen on `.viewer-pane` via the native
            // Fullscreen API. We deliberately bypass webgi's
            // FullScreenPlugin — it fullscreens just the canvas, which
            // (a) hides the action bar and (b) hides the
            // `.fullscreen-close` button (browsers only render the
            // fullscreen element + descendants). Targeting the whole
            // viewer pane keeps both visible.
            function toggleFullscreen() {
                const root = document.querySelector('.viewer-pane')
                          || document.getElementById('viewer-container')
                          || document.documentElement;
                if (document.fullscreenElement) {
                    document.exitFullscreen?.();
                } else {
                    root.requestFullscreen?.();
                }
            }

            // AR Try-On — the web-vto bundle is loaded via <script> in
            // <head> and `RingTryonPlugin.preload()` already kicked off
            // MediaPipe asset prefetch at page load. We just need to add
            // the plugin to the viewer on first use. Passing
            // `{ preload: true }` mirrors web-vto/src/index.ts:59 — webgi
            // re-invokes the static preload during addPlugin (no-op if
            // assets already cached).
            //
            // TRYON_CONFIG mirrors /Volumes/E/ijewel/RingConfig.json —
            // setup-mode placement (modelScaleFactor / position /
            // rotation) plus the SSR + SSAO post-processing tuning the
            // ring needs for skin contact. Applied via fromJSON after
            // addPlugin so the live-camera scene matches the saved
            // setup. The Vector3 entries carry `isVector3: true` so
            // webgi rehydrates them into THREE.Vector3 (matches the
            // exported config shape from setupMode.downloadConfig).
            const TRYON_CONFIG = {
                enabled: true,
                ssr: { enabled: true, intensity: 1.5, radius: 2, tolerance: 5 },
                ssao: { enabled: true, intensity: 0.2, radius: 1.83, falloff: 1.5, bias: 0.00001 },
                modelScaleFactor: 0.05558367700803834,
                modelPosition: { x: 0, y: 0.17174634515494436, z: 0.005700611106190974, isVector3: true },
                modelRotation: { x: 1.5231562043547288, y: 7.106062769340546e-9, z: 0.00001640165498308485, isVector3: true },
                type: "RingTryonPlugin"
            };

            async function ensureTryonReady() {
                if (state.ar.plugin) return state.ar.plugin;
                if (!state.viewer) throw new Error('viewer not ready');
                if (state.ar.loading) return state.ar.loading;
                const vto = window.ij_vto;
                if (!vto?.RingTryonPlugin) throw new Error('web-vto bundle not loaded');
                state.ar.loading = (async () => {
                    const plugin = await state.viewer.addPlugin(vto.RingTryonPlugin, { preload: true });
                    if (vto.RingTryonUIPlugin) {
                        try { await state.viewer.addPlugin(vto.RingTryonUIPlugin); } catch (_) {}
                    }
                    try { plugin.fromJSON?.(TRYON_CONFIG); }
                    catch (e) { console.warn('[tryon] fromJSON failed', e); }
                    state.ar.plugin = plugin;
                    return plugin;
                })();
                try { return await state.ar.loading; }
                finally { state.ar.loading = null; }
            }
            async function toggleTryOn() {
                const btn = document.getElementById('btn-tryon');
                try {
                    markLoading(true);
                    const plugin = await ensureTryonReady();
                    if (plugin.running) {
                        await plugin.stop();
                        state.ar.running = false;
                        btn?.classList.remove('is-on');
                    } else {
                        await plugin.start();
                        state.ar.running = true;
                        btn?.classList.add('is-on');
                    }
                    // Gate sidebar controls on try-on state: while running,
                    // only Gem Colour and Metal Colour stay interactive
                    // (see `body.tryon-active` rules in style-v4.css).
                    document.body.classList.toggle('tryon-active', state.ar.running);
                } catch (e) {
                    console.error('[tryon] toggle failed', e);
                    showToast("Couldn't start Try-On");
                    btn?.classList.remove('is-on');
                    document.body.classList.remove('tryon-active');
                } finally {
                    markLoading(false);
                }
            }

            // Start / stop automatic camera rotation. Prefers the WebGI
            // RotateCameraPlugin when present; otherwise flips
            // `controls.autoRotate` on the active camera.
            function toggleRotate() {
                const v = state.viewer;
                if (!v) return;
                const plugin = v.getPluginByType?.('RotateCameraPlugin')
                            || v.getPluginByType?.('RotateCamera');
                if (plugin) {
                    try {
                        if (typeof plugin.toggle === 'function') return plugin.toggle();
                        if (plugin.enabled !== undefined) {
                            plugin.enabled = !plugin.enabled;
                            v.setDirty?.();
                            return;
                        }
                    } catch (e) { console.warn('[rotate] plugin path failed', e); }
                }
                try {
                    const cam   = v.scene?.activeCamera;
                    const ctrls = cam?.controls || cam?._controls;
                    if (ctrls && 'autoRotate' in ctrls) {
                        ctrls.autoRotate = !ctrls.autoRotate;
                        if (!('autoRotateSpeed' in ctrls) || !ctrls.autoRotateSpeed) {
                            ctrls.autoRotateSpeed = 2.0;
                        }
                        v.setDirty?.();
                    }
                } catch (e) { console.warn('[rotate] controls path failed', e); }
            }

            // ── Footer + chrome buttons ─────────────────────────────────
            // window.__ringBuilderUI exposes named handlers so the eventual
            // host integration can override them. The default implementations
            // here are real (no longer logging placeholders).
            window.__ringBuilderUI = {
                onShare:     () => shareLink(),
                onFullscreen:() => toggleFullscreen(),
                onRotate:    () => toggleRotate(),
                onTryOn:     () => toggleTryOn(),
                onFavorites: () => console.log('[ui] favorites clicked'),
                onFavoriteOverlay: () => console.log('[ui] heart-overlay clicked'),
                onExit:      () => console.log('[ui] exit clicked'),
                onAccount:   () => console.log('[ui] account clicked'),
                onWishlist:  () => console.log('[ui] wishlist clicked'),
                onBag:       () => console.log('[ui] bag clicked'),
            };

            // Keep the fullscreen button's "active" state in sync with the
            // actual fullscreen status — covers ESC-to-exit and OS-level
            // fullscreen changes the button never triggered.
            document.addEventListener('fullscreenchange', () => {
                const isFull = !!document.fullscreenElement;
                document.getElementById('btn-fullscreen')?.classList.toggle('is-on', isFull);
            });
            const wire = (id, key, toggle = false) => {
                const node = document.getElementById(id);
                if (!node) return;
                node.addEventListener('click', () => {
                    if (toggle) node.classList.toggle('is-on');
                    try { window.__ringBuilderUI[key]?.(); } catch (e) { console.error(e); }
                });
            };
            // Fullscreen close button (only visible while in fullscreen).
            // Reuses toggleFullscreen so the FullScreenPlugin / native
            // Fullscreen API exit path is exactly the same as the
            // action-bar Full button.
            document.getElementById('btn-fullscreen-close')
                ?.addEventListener('click', () => toggleFullscreen());

            // Try-On overlay controls (only visible while AR is running).
            // Mirrors the web-vto pattern: `flipCamera()` swaps front/back
            // and `stop()` exits — `toggleTryOn` already handles the stop
            // path and clears the `body.tryon-active` sidebar lockdown.
            document.getElementById('btn-tryon-exit')
                ?.addEventListener('click', () => {
                    if (state.ar.running) toggleTryOn();
                });
            document.getElementById('btn-tryon-flip')
                ?.addEventListener('click', async () => {
                    const plugin = state.ar.plugin;
                    if (!plugin || !plugin.running) return;
                    try { await plugin.flipCamera(); }
                    catch (e) { console.warn('[tryon] flipCamera failed', e); }
                });

            wire('btn-share',            'onShare');
            wire('btn-fullscreen',       'onFullscreen', true);
            wire('btn-rotate',           'onRotate',     true);
            wire('btn-tryon',            'onTryOn',      true);
            wire('btn-favorites',        'onFavorites',  true);
            wire('btn-favorite-overlay', 'onFavoriteOverlay', true);
            wire('btn-exit',             'onExit');
            wire('btn-account',          'onAccount');
            wire('btn-wishlist',         'onWishlist');
            wire('btn-bag',              'onBag');

            // ── Field utilities ──────────────────────────────────────────
            function getFieldEl(fieldName) {
                return document.querySelector(`.field[data-field="${fieldName}"]`);
            }
            function setFieldValue(fieldName, text) {
                const f = getFieldEl(fieldName);
                if (!f) return;
                const v = f.querySelector('[data-role="value"]');
                if (!v) return;
                const clean = (text == null || text === '') ? '—' : String(text);
                v.textContent = clean;
                v.classList.toggle('empty', clean === '—');
            }
            function setFieldContent(fieldName, contentEl) {
                const f = getFieldEl(fieldName);
                if (!f) return;
                const c = f.querySelector('.field-content');
                c.innerHTML = '';
                if (contentEl) c.appendChild(contentEl);
            }
            function setFieldEmpty(fieldName, msg) {
                setFieldContent(fieldName, el('div', { class: 'field-empty', text: msg }));
                setFieldValue(fieldName, '—');
            }
            function setLoading(node, loading) {
                if (!node) return;
                const was = node.classList.contains('loading');
                node.classList.toggle('loading', !!loading);
                if (!!loading !== was) markLoading(!!loading);
            }

            // ── Global loading indicator (bottom-left toast) ─────────────
            // Maintains a refcount of in-flight component/material applies
            // so the toast stays visible across concurrent operations and
            // disappears only when the last one settles.
            let _loadingCount = 0;
            function markLoading(on) {
                if (on) {
                    _loadingCount++;
                    if (_loadingCount === 1) showLoadingIndicator(true);
                } else {
                    _loadingCount = Math.max(0, _loadingCount - 1);
                    if (_loadingCount === 0) showLoadingIndicator(false);
                }
            }
            function showLoadingIndicator(visible) {
                let t = document.getElementById('app-loading-toast');
                if (!t) {
                    t = document.createElement('div');
                    t.id = 'app-loading-toast';
                    t.className = 'app-loading-toast';
                    t.innerHTML =
                        '<span class="alt-spinner" aria-hidden="true"></span>' +
                        '<span class="alt-text">Loading…</span>';
                    document.body.appendChild(t);
                }
                t.classList.toggle('show', !!visible);
            }

            // ── Tag parser ───────────────────────────────────────────────
            const parseTags = (v) => {
                const out = { type: null, shape: null, size: null };
                (v.tags || []).forEach(t => {
                    if (t.startsWith('type:'))  out.type  = t.split(':')[1];
                    if (t.startsWith('shape:')) out.shape = t.split(':')[1];
                    if (t.startsWith('size:'))  out.size  = t.split(':')[1];
                });
                return out;
            };
            const parseCarat = (s) => parseFloat(String(s || '').replace(/[^\d.]/g, '')) || 0;
            const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
            // Tag values like `type:half-eternity` should render as
            // `Half Eternity` — hyphen/underscore → space, capitalize each word.
            const formatTagValue = (s) => !s ? '' :
                String(s).split(/[-_]+/).filter(Boolean)
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                    .join(' ');
            const cleanName = (s) => (s || '').replace(/\.glb$/i, '');
            // Prefer a variation's `type:` tag (formatted) when present, else
            // fall back to a hyphen-formatted cleaned title/name.
            function variationLabel(v) {
                if (!v) return '';
                const { type } = parseTags(v);
                if (type) return formatTagValue(type);
                return formatTagValue(cleanName(v.title || v.name));
            }

            // Render a `size:` tag value for UI. Numeric sizes get a " mm"
            // suffix ("3" → "3 mm"); non-numeric values just get formatted
            // ("half-eternity" → "Half Eternity").
            const formatSizeLabel = (size) => {
                if (size == null || size === '') return '';
                const s = String(size);
                return /^[\d.]+$/.test(s) ? `${s} mm` : formatTagValue(s);
            };

            // Per-swatch label for variation grids. When multiple variations
            // share one `type:` tag (e.g. three "Upave" bands differing only
            // by `size:`), `variationLabel` would collapse them all to the
            // same string. Appending the formatted size restores per-card
            // distinction. No size tag → falls back to `variationLabel`.
            function variationSwatchLabel(v) {
                if (!v) return '';
                const base = variationLabel(v);
                const { size } = parseTags(v);
                if (!size) return base;
                const sizeText = formatSizeLabel(size);
                return base ? `${base} ${sizeText}` : sizeText;
            }

            const caratTier = (c) => {
                if (!c) return '';
                if (c <= 0.55) return 'Petite';
                if (c <= 1.05) return 'Classic';
                if (c <= 1.55) return 'Generous';
                return 'Statement';
            };

            // ── Style class detection (for swatches w/o icons) ───────────
            const colorSwatchClass = (label, variationTitle = '') => {
                const n = (label || '').toLowerCase();
                const vn = (variationTitle || '').toLowerCase();
                // SKU mapping: 01-1 = Gold, 01-2 = Rose Gold, 01-3 = White Gold
                if (n.includes('01-2') ||
                    (n.includes('rose') && (n.includes('gold') || vn.includes('metal')))) {
                    return 'material-swatch-rose-gold';
                }
                if (n.includes('01-3') || /(^|\s)metal\s*-?\s*3(\b|$)/.test(n) ||
                    (n.includes('white') && (n.includes('gold') || vn.includes('metal')))) {
                    return 'material-swatch-white-gold';
                }
                if (n.includes('01-1') ||
                    (n.includes('yellow') && (n.includes('gold') || vn.includes('metal'))) ||
                    (n.includes('gold') && !n.includes('rose') && !n.includes('white') && (vn.includes('metal') || n.includes('01-')))) {
                    return 'material-swatch-gold';
                }
                return '';
            };
            const gemSwatchClass = (label) => {
                const n = (label || '').toLowerCase();
                if (n.includes('diamond')) return 'gem-swatch-diamond';
                if (n.includes('sapphire')) return 'gem-swatch-sapphire';
                if (n.includes('ruby')) return 'gem-swatch-ruby';
                if (n.includes('emerald')) return 'gem-swatch-emerald';
                return 'gem-swatch-diamond';
            };

            // ── Variation/material role classification ──────────────────
            const ringCompRole = (name) => {
                const n = (name || '').toLowerCase();
                if (n.includes('head')) return 'head';
                if (n.includes('shank')) return 'shank';
                if (n.includes('band')) return 'band';
                return null;
            };
            const materialRole = (title) => {
                const t = (title || '').toLowerCase();
                if (t.includes('gem') || t.includes('stone') || t.includes('center') ||
                    t.includes('diamond') || t.includes('sapphire') || t.includes('ruby') ||
                    t.includes('emerald')) return 'gem';
                if (t.includes('head')) return 'metal-head';
                if (t.includes('shank')) return 'metal-shank';
                if (t.includes('band')) return 'metal-band';
                if (t.includes('metal') || t.includes('gold')) return 'metal';
                return 'other';
            };

            // ── Band positioning (v3 parity) ──────────────────────────────
            // Delegates band placement to the RingConfigurator plugin's
            // `matchBaseHeight(shank, band, gap, side)`. World-space gap is
            // the same constant as v3 (default 5, override with `?gap=` URL
            // param) so band spacing matches v3 exactly.
            const GAP_OVERRIDE = (() => {
                const v = parseFloat(new URLSearchParams(window.location.search).get('gap'));
                return Number.isFinite(v) && v >= 0 ? v : 5;
            })();

            // Re-fit the ground plane to current scene bounds so the contact
            // shadow rebakes against the new geometry. Safe to call frequently —
            // GroundPlugin internally debounces via _transformNeedRefresh.
            function refreshShadow() {
                try {
                    const v = state.viewer;
                    if (!v) return;
                    const ground = v.getPluginByType?.('Ground') ?? v.getPlugin?.('Ground');
                    ground?.refreshTransform?.();
                } catch (e) {
                    console.warn('refreshShadow failed', e);
                }
            }

            function alignRingAndBands() {
                const plugin = state.ringPlugin;
                const shank  = state.comps.shank;

                // Position ALL bands (even hidden ones) so they're ready to
                // reveal in the correct spot — no flash at the origin when
                // the user re-enables a hidden band.
                if (plugin && shank) {
                    const bands = state.ringComponents.filter(c => c && /band/i.test(c.name || ''));
                    bands.forEach((band, i) => {
                        // Alternate sides: index 0 → +Z, 1 → −Z, 2 → +Z, …
                        const side = i % 2 === 0 ? 1 : -1;
                        try { plugin.matchBaseHeight(shank, band, GAP_OVERRIDE, side); }
                        catch (e) { console.warn('matchBaseHeight failed for', band.name, e); }
                    });
                }

                // Older plugin builds without refitRootScaleToBounds need a
                // manual shadow refresh + camera fit pass.
                if (!plugin?.refitRootScaleToBounds) {
                    refreshShadow();
                    try { state.viewer?.fitToView?.(undefined, 1.5, 0.5); } catch (_) {}
                }
                try { state.viewer?.setDirty?.(); } catch (_) {}
            }
            window.refreshShadow     = refreshShadow;
            window.alignRingAndBands = alignRingAndBands;

            /* ============================================================
               STATE
               ============================================================ */
            const state = {
                viewer: null,
                ringPlugin: null,
                materialPlugin: null,
                ringComponents: [],
                currentType:           null,
                currentShape:          null,
                currentBandType:       null,
                sizeDropdown:          null,
                bandThicknessDropdown: null,
                // Tracks whether we've already done the once-per-session
                // force-hide of the band component on first load.
                bandInitialized: false,
                comps: { head: null, shank: null, band: null },
                mats: { gem: null, metalHead: null, metalShank: null, metalBand: null, metalGeneric: null },
                sel: {
                    head: null, headType: null, size: null, shape: null, gemType: null,
                    shankType: null, shankColor: null,
                    bandType: null
                },
                // AR Try-On: lazy-loaded RingTryonPlugin instance + session flags.
                ar: { plugin: null, loading: false, running: false }
            };
            window.__ringBuilder = state;

            /* ============================================================
               RING COMPONENT RENDERERS (Shape / Shank / Band)
               ============================================================ */
            // Render a list of variations as swatches.
            // - `opts.filterTypeKey`: restrict to variations whose `type:` tag matches.
            // - `opts.toggleable`: clicking the already-selected swatch hides the
            //   whole component (band-style toggle); clicking any swatch while
            //   hidden re-shows it. `opts.onToggleOff` / `opts.onToggleOn` let the
            //   caller sync external UI state (e.g. group `.component-hidden`).
            function renderVariationSwatches(fieldName, component, opts = {}) {
                if (!component || !component.variations || !component.variations.length) {
                    setFieldEmpty(fieldName, opts.emptyMsg || 'Not configurable for this model');
                    return;
                }
                const entries = component.variations
                    .map((v, i) => ({ v, i, tags: parseTags(v) }))
                    .filter(e => !opts.filterTypeKey || e.tags.type === opts.filterTypeKey);
                if (!entries.length) {
                    setFieldEmpty(fieldName, opts.emptyMsg || 'Not configurable for this model');
                    return;
                }
                const grid = el('div', { class: 'swatch-grid' });

                // Optional leading "None" swatch (band-style Path B). Hidden
                // component → starts selected; clicking it hides the
                // component via the caller's `opts.onNone` handler.
                if (opts.prependNone) {
                    const noneSel = component.visible === false;
                    const noneSw = createBandNoneSwatch(noneSel, () => {
                        if (component.visible === false) return;
                        opts.onNone?.();
                        grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                        noneSw.classList.add('selected');
                        setFieldValue(fieldName, '—');
                    });
                    grid.appendChild(noneSw);
                }

                entries.forEach(({ v, i }) => {
                    // Initial selected state honors visibility: when toggleable
                    // and the component is hidden, no swatch starts selected.
                    const initiallySelected = (i === component.selectedIndex)
                        && (!opts.toggleable || component.visible !== false);

                    const swatch = createTypeSwatch(v, initiallySelected, async () => {
                        // Toggle off: clicking the currently-selected swatch
                        // while the component is visible hides the component
                        // instead of re-applying the same variation.
                        if (opts.toggleable && swatch.classList.contains('selected')
                            && component.visible !== false) {
                            opts.onToggleOff?.();
                            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                            setFieldValue(fieldName, '—');
                            return;
                        }

                        setLoading(swatch, true);
                        // If the component is hidden, keep it hidden through
                        // the model swap so it doesn't flash at the origin
                        // before alignment runs. Reveal at the very end.
                        const wasHidden = opts.toggleable && component.visible === false;
                        try {
                            await component.applyVariation(v);
                            if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                            alignRingAndBands();
                            if (wasHidden) opts.onToggleOn?.();
                            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                            swatch.classList.add('selected');
                            setFieldValue(fieldName, variationLabel(v));
                            if (opts.onSelect) opts.onSelect(v, i);
                        } finally {
                            setLoading(swatch, false);
                        }
                    });
                    grid.appendChild(swatch);
                });
                setFieldContent(fieldName, grid);
                const cur = component.variations[component.selectedIndex];
                const showValue = cur && (!opts.toggleable || component.visible !== false);
                setFieldValue(fieldName, showValue ? variationLabel(cur) : '—');
            }

            function createTypeSwatch(variation, isSelected, onClick) {
                const sw = el('div', { class: `swatch${isSelected ? ' selected' : ''}` });
                const img = el('div', { class: 'swatch-img' });
                // Prefer our local SVG libraries (gem shape, then shank
                // suffix); fall back to plugin icon, then placeholder.
                if (!fillVariationIconInto(img, variation)) {
                    if (variation.icon) {
                        const i = el('img', { src: variation.icon, alt: variation.title || variation.name });
                        i.onerror = () => { i.remove(); img.classList.add('placeholder'); };
                        img.appendChild(i);
                    } else {
                        img.classList.add('placeholder');
                    }
                }
                sw.appendChild(img);
                sw.appendChild(el('span', { class: 'swatch-label', text: variationSwatchLabel(variation) }));
                sw.addEventListener('click', onClick);
                return sw;
            }

            // "None" swatch used by the band-style grid: clicking it hides
            // the band component. `data-type="__none__"` keeps it out of
            // the normal type-cascade selection logic in setBandHidden.
            function createBandNoneSwatch(isSelected, onClick) {
                const sw = el('div', {
                    class: `swatch swatch-none${isSelected ? ' selected' : ''}`,
                    'data-type': '__none__'
                });
                const img = el('div', { class: 'swatch-img has-local-svg' });
                img.innerHTML =
                    '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" ' +
                    'stroke-width="3" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">' +
                        '<circle cx="32" cy="32" r="22"/>' +
                        '<line x1="17.5" y1="46.5" x2="46.5" y2="17.5"/>' +
                    '</svg>';
                sw.appendChild(img);
                sw.appendChild(el('span', { class: 'swatch-label', text: 'None' }));
                sw.addEventListener('click', onClick);
                return sw;
            }

            // Tries the gem-shape library first (matches the `shape:` tag
            // or variation name), then the shank library (matches a code
            // like `SH8 PL` → suffix `pl` → "plain"). Returns true once an
            // icon is rendered into `imgWrap`.
            function fillVariationIconInto(imgWrap, variation) {
                if (fillShapeIconInto(imgWrap, shapeKeyForVariation(variation))) return true;
                if (typeof window.getShankIcon === 'function') {
                    const name = cleanName(variation.name || variation.title);
                    const svg  = window.getShankIcon(name);
                    if (svg) {
                        imgWrap.innerHTML = svg;
                        imgWrap.classList.add('has-local-svg');
                        return true;
                    }
                }
                return false;
            }

            /* ============================================================
               HEAD — Type → Shape → Size cascade (v3 parity)
               Mirrors v3's renderHeadSection / renderHeadType /
               renderHeadShapesForType: head-type swatches at level 1 filter
               the shape swatches at level 2, which filter the carat dropdown
               at level 3. Falls back gracefully when type/shape tags are
               missing for the loaded model.
               ============================================================ */

            // Build a 3-level hierarchy: type → shape → [variations with size].
            function groupHeadVariations(component) {
                const byType = {};
                component.variations.forEach((v, i) => {
                    const { type, shape, size } = parseTags(v);
                    const typeKey  = type  || '__none__';
                    const shapeKey = shape || '__none__';
                    if (!byType[typeKey]) byType[typeKey] = { type, icon: v.icon, shapes: {} };
                    if (!byType[typeKey].shapes[shapeKey]) {
                        byType[typeKey].shapes[shapeKey] = { shape, icon: v.icon, variations: [] };
                    }
                    byType[typeKey].shapes[shapeKey].variations.push({ variation: v, originalIndex: i, size });
                });
                return byType;
            }

            /* ── Master entry point for Head section ─────────────────── */
            function renderHeadSection(component) {
                const byType = groupHeadVariations(component);
                const typeKeys = Object.keys(byType).filter(k => k !== '__none__');

                // Path A: variations carry `type:` tags → 3-level cascade
                if (typeKeys.length) {
                    renderHeadType(component, byType, typeKeys);
                    return;
                }

                // Path B: no type tags → 2-level shape → size (or flat)
                setFieldEmpty('head-type', 'Type not available for this model');
                state.sel.headType = null;
                state.currentType = null;
                renderHeadShapesForType(component, byType, '__none__', parseTags(component.variations[component.selectedIndex]));
            }

            /* ── Level 1: Head type swatches ─────────────────────────── */
            function renderHeadType(component, byType, typeKeys) {
                const selected = component.variations[component.selectedIndex];
                const selInfo = parseTags(selected);

                const activeType = (selInfo.type && typeKeys.includes(selInfo.type)) ? selInfo.type : typeKeys[0];
                state.currentType = activeType;

                const grid = el('div', { class: 'swatch-grid' });
                typeKeys.forEach(typeKey => {
                    const g = byType[typeKey];
                    const isSel = state.currentType === typeKey;
                    const sw = el('div', {
                        class: `swatch${isSel ? ' selected' : ''}`,
                        'data-type': typeKey
                    });
                    const img = el('div', { class: 'swatch-img' });
                    // Head types ("solitaire", "halo"…) — use dedicated
                    // head icon lookup to avoid collisions with band types.
                    if (!fillHeadIconInto(img, typeKey)) {
                        if (g.icon) {
                            const i = el('img', { src: g.icon, alt: typeKey });
                            i.onerror = () => { i.remove(); img.classList.add('placeholder'); };
                            img.appendChild(i);
                        } else {
                            img.classList.add('placeholder');
                        }
                    }
                    sw.appendChild(img);
                    sw.appendChild(el('span', { class: 'swatch-label', text: formatTagValue(typeKey) }));

                    sw.addEventListener('click', async () => {
                        if (state.currentType === typeKey) return;
                        console.log('Changing head type to:', typeKey);
                        setLoading(sw, true);
                        try {
                            // Pick best shape match within new type; fall back to first.
                            const targetTypeGroup = byType[typeKey];
                            const shapeKeys = Object.keys(targetTypeGroup.shapes).filter(k => k !== '__none__');
                            const targetShapeKey = shapeKeys.includes(selInfo.shape) ? selInfo.shape : shapeKeys[0];
                            const sg = targetTypeGroup.shapes[targetShapeKey] || targetTypeGroup.shapes['__none__'];
                            if (sg && sg.variations.length) {
                                const next = sg.variations.find(x => x.size === selInfo.size) || sg.variations[0];
                                await component.applyVariation(next.variation);
                                if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                                alignRingAndBands();
                            }
                        } finally {
                            setLoading(sw, false);
                        }
                    });
                    grid.appendChild(sw);
                });

                setFieldContent('head-type', grid);
                setFieldValue('head-type', formatTagValue(state.currentType));
                state.sel.headType = formatTagValue(state.currentType);

                // Cascade to level 2.
                renderHeadShapesForType(component, byType, state.currentType, selInfo);
            }

            /* ── Level 2: Shape swatches filtered by current type ────── */
            function renderHeadShapesForType(component, byType, typeKey, selInfo) {
                const typeGroup = byType[typeKey];
                if (!typeGroup) {
                    setFieldEmpty('shape', 'No shapes for this type');
                    setFieldEmpty('size', 'No carat sizes available');
                    state.sel.shape = null;
                    state.sel.size  = null;
                    return;
                }
                const shapeKeys = Object.keys(typeGroup.shapes).filter(k => k !== '__none__');

                // No shape tags → degrade to flat variation swatches.
                if (!shapeKeys.length) {
                    renderVariationSwatches('shape', component, {
                        filterTypeKey: typeKey === '__none__' ? null : typeKey,
                        onSelect: (v) => {
                            state.sel.shape = variationLabel(v);
                            setFieldEmpty('size', 'Carat size not available for this model');
                        },
                        emptyMsg: 'No head shapes available'
                    });
                    const sel = component.variations[component.selectedIndex];
                    state.sel.shape = sel ? variationLabel(sel) : null;
                    setFieldEmpty('size', 'Carat size not available for this model');
                    state.sel.size = null;

                    return;
                }

                state.currentShape = (selInfo.type === typeKey && selInfo.shape && shapeKeys.includes(selInfo.shape))
                    ? selInfo.shape : shapeKeys[0];

                const grid = el('div', { class: 'swatch-grid' });
                shapeKeys.forEach(shapeKey => {
                    const sg = typeGroup.shapes[shapeKey];
                    const sw = el('div', {
                        class: `swatch${state.currentShape === shapeKey ? ' selected' : ''}`,
                        'data-shape': shapeKey
                    });
                    const img = el('div', { class: 'swatch-img' });
                    // Shape swatches are the main consumer of the local
                    // icon library — `shapeKey` is the parsed `shape:` tag.
                    if (!fillShapeIconInto(img, shapeKey)) {
                        if (sg.icon) {
                            const i = el('img', { src: sg.icon, alt: shapeKey });
                            i.onerror = () => { i.remove(); img.classList.add('placeholder'); };
                            img.appendChild(i);
                        } else {
                            img.classList.add('placeholder');
                        }
                    }
                    sw.appendChild(img);
                    sw.appendChild(el('span', { class: 'swatch-label', text: formatTagValue(shapeKey) }));

                    sw.addEventListener('click', async () => {
                        if (state.currentShape === shapeKey) return;
                        setLoading(sw, true);
                        try {
                            const next = sg.variations.find(x => x.size === selInfo.size) || sg.variations[0];
                            await component.applyVariation(next.variation);
                            if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                            alignRingAndBands();
                        } finally {
                            setLoading(sw, false);
                        }
                    });

                    grid.appendChild(sw);
                });

                setFieldContent('shape', grid);
                setFieldValue('shape', formatTagValue(state.currentShape));
                state.sel.shape = formatTagValue(state.currentShape);

                rebuildSizeDropdown(component, typeKey === '__none__' ? null : typeKey, state.currentShape);
                state.sel.size = selInfo.size;

            }

            // Size dropdown — filters by current type + shape. `typeKey` may be
            // null when the model has no type tags.
            function rebuildSizeDropdown(component, typeKey, shapeKey) {
                const byType = groupHeadVariations(component);
                const bucket = byType[typeKey || '__none__'];
                const shapeGroup = bucket && bucket.shapes && bucket.shapes[shapeKey];
                if (!shapeGroup || !shapeGroup.variations.length) {
                    setFieldEmpty('size', 'No carat sizes for this shape');
                    state.sizeDropdown = null;
                    return;
                }

                const sorted = shapeGroup.variations
                    .map(x => ({ ...x, carat: parseCarat(x.size) }))
                    .filter(x => x.carat > 0 || x.size)
                    .sort((a, b) => a.carat - b.carat);

                const options = sorted.map(x => ({
                    value: x.size,
                    label: `${x.carat.toFixed(2)} ct`,
                    _ref:  x
                }));

                const sel = component.variations[component.selectedIndex];
                const selInfo = parseTags(sel);
                const sameContext = (!typeKey || selInfo.type === typeKey) && selInfo.shape === shapeKey;
                const currentValue = (sameContext && selInfo.size && options.some(o => o.value === selInfo.size))
                    ? selInfo.size : options[0].value;

                if (!state.sizeDropdown) {
                    state.sizeDropdown = window.createGemSizeDropdown({
                        options,
                        value: currentValue,
                        placeholder: 'Choose carat size',
                        onChange: async (val, opt) => {
                            const target = opt && opt._ref;
                            if (!target) return;
                            state.sizeDropdown.setLoading(true);
                            markLoading(true);
                            try {
                                await component.applyVariation(target.variation);
                                if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                                alignRingAndBands();
                                state.sel.size = target.size;
                                setFieldValue('size', `${target.carat.toFixed(2)} ct`);
                            } finally {
                                state.sizeDropdown.setLoading(false);
                                markLoading(false);
                            }
                        }
                    });
                    setFieldContent('size', state.sizeDropdown.element);
                } else {
                    state.sizeDropdown.setOptions(options, { value: currentValue });
                }
                const curCarat = parseCarat(currentValue);
                setFieldValue('size', curCarat ? `${curCarat.toFixed(2)} ct` : '—');
            }

            /* ============================================================
               BAND VISIBILITY — click-selected-to-hide / click-again-to-show
               ============================================================ */
            // Toggle the band component's visibility. The band-type field text
            // and the section's faded-out state both reflect this. After
            // showing, bands are re-aligned and the scene is re-rendered.
            function setBandHidden(hidden, opts = {}) {
                const band = state.comps.band;
                if (!band) return;

                try { band.setVisible(!hidden); } catch (_) {}

                if (hidden) {
                    state.sel.bandType  = null;
                    setFieldValue('band-type', '—');
                } else {
                    const sel = band.variations[band.selectedIndex];
                    const label = sel ? variationLabel(sel) : null;
                    state.sel.bandType = label;
                    setFieldValue('band-type', label || '—');
                }

                // Sync selected styling on band-type swatches. Type-keyed
                // swatches (Path A) carry `data-type`; the flat fallback
                // grid (Path B) is index-aligned with band.variations.
                // Path A also carries a leading "None" swatch
                // (`.swatch-none`, `data-type="__none__"`) — selected
                // when the band is hidden.
                const grid = document.querySelector('.field[data-field="band-type"] .swatch-grid');
                if (grid) {
                    const swatches = grid.querySelectorAll('.swatch');
                    const noneSw   = grid.querySelector('.swatch-none');
                    // Determine cascaded mode by looking past the optional
                    // leading None swatch — Path A always has at least one
                    // type swatch after it.
                    const firstReal = noneSw ? swatches[1] : swatches[0];
                    const cascaded = firstReal?.hasAttribute('data-type');
                    swatches.forEach(sw => sw.classList.remove('selected'));
                    if (hidden) {
                        noneSw?.classList.add('selected');
                    } else if (cascaded) {
                        const sel = band.variations[band.selectedIndex];
                        const selType = sel ? parseTags(sel).type : null;
                        swatches.forEach(sw => {
                            if (sw === noneSw) return;
                            sw.classList.toggle('selected', sw.getAttribute('data-type') === selType);
                        });
                    } else {
                        swatches.forEach((sw, i) => {
                            sw.classList.toggle('selected', i === band.selectedIndex);
                        });
                    }
                }

                if (!hidden && !opts.skipAlign) alignRingAndBands();
                // Visibility flip changes scene bounds → rebake the contact
                // shadow regardless of whether alignRingAndBands ran above.
                refreshShadow();
                try { state.viewer?.setDirty?.(); } catch (_) {}

            }

            /* ============================================================
               BAND — Type swatches + Thickness dropdown (tag-based cascade)
               Mirrors v3's renderBandSection / renderBandType: one swatch
               per `type:` tag (Upave, Plain, Pave, French, …), the
               thickness <select> cascades to that type's `size:` values.
               ============================================================ */

            // Group band variations by `type:` tag into:
            //   { typeKey → { type, icon, variations: [{ variation, size }] } }
            function groupBandByType(component) {
                const byType = {};
                component.variations.forEach((v, i) => {
                    const { type, size } = parseTags(v);
                    const typeKey = type || '__none__';
                    if (!byType[typeKey]) byType[typeKey] = { type, icon: v.icon, variations: [] };
                    byType[typeKey].variations.push({ variation: v, originalIndex: i, size });
                });
                return byType;
            }

            // Master entry point for the Band STYLE subgroup.
            function renderBandSection(component) {
                const byType   = groupBandByType(component);
                const typeKeys = Object.keys(byType).filter(k => k !== '__none__');

                // Path A: type tags present → one swatch per type, sizes
                // cascade into the Band thickness <select>.
                if (typeKeys.length) {
                    renderBandType(component, byType, typeKeys);
                    return;
                }

                // Path B: no type tags → flat swatch list (legacy fallback).
                state.currentBandType = null;
                renderVariationSwatches('band-type', component, {
                    toggleable: true,
                    prependNone: true,
                    onNone: () => setBandHidden(true, { skipAlign: true }),
                    onSelect: (v) => { state.sel.bandType = variationLabel(v); },
                    onToggleOff: () => setBandHidden(true,  { skipAlign: true }),
                    onToggleOn:  () => setBandHidden(false, { skipAlign: true })
                });
                const sel = component.variations[component.selectedIndex];
                state.sel.bandType = (component.visible !== false && sel) ? variationLabel(sel) : null;
                wireBandThicknessSelect();
            }

            // Level 1: render one swatch per band type. Clicking the
            // currently-selected type toggles band visibility (v3 parity).
            function renderBandType(component, byType, typeKeys) {
                const selected = component.variations[component.selectedIndex];
                const selInfo  = parseTags(selected);
                const isHidden = component.visible === false;

                const activeType = (selInfo.type && typeKeys.includes(selInfo.type))
                    ? selInfo.type : typeKeys[0];
                state.currentBandType = activeType;

                const grid = el('div', { class: 'swatch-grid' });

                // "None" — explicit "remove band" affordance. Placed first
                // so it reads as the no-band choice at the top of the grid.
                const noneSw = createBandNoneSwatch(isHidden, () => {
                    if (component.visible === false) return;
                    setBandHidden(true, { skipAlign: true });
                });
                grid.appendChild(noneSw);

                typeKeys.forEach(typeKey => {
                    const g = byType[typeKey];
                    const isSel = !isHidden && state.currentBandType === typeKey;
                    const sw = el('div', {
                        class: `swatch${isSel ? ' selected' : ''}`,
                        'data-type': typeKey
                    });
                    const img = el('div', { class: 'swatch-img' });
                    // Band types ("upave", "plain", …) won't match shape-icon
                    // keys, but try anyway in case a project reuses them.
                    if (!fillShapeIconInto(img, typeKey)) {
                        if (g.icon) {
                            const i = el('img', { src: g.icon, alt: typeKey });
                            i.onerror = () => { i.remove(); img.classList.add('placeholder'); };
                            img.appendChild(i);
                        } else {
                            img.classList.add('placeholder');
                        }
                    }
                    sw.appendChild(img);
                    sw.appendChild(el('span', { class: 'swatch-label', text: formatTagValue(typeKey) }));

                    sw.addEventListener('click', async () => {
                        // Toggle off: clicking the currently-selected type
                        // while the band is visible hides the band entirely.
                        if (state.currentBandType === typeKey && component.visible !== false) {
                            setBandHidden(true, { skipAlign: true });
                            return;
                        }
                        setLoading(sw, true);
                        const wasHidden = component.visible === false;
                        try {
                            const targetGroup = byType[typeKey];
                            // Preserve the current size when switching types
                            // if that size exists in the new type group.
                            const next = targetGroup.variations.find(x => x.size === selInfo.size)
                                      || targetGroup.variations[0];
                            if (!next) return;
                            await component.applyVariation(next.variation);
                            if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                            alignRingAndBands();
                            if (wasHidden) setBandHidden(false, { skipAlign: true });
                            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                            sw.classList.add('selected');
                            state.currentBandType = typeKey;
                            state.sel.bandType = formatTagValue(typeKey);
                            setFieldValue('band-type', state.sel.bandType);
                            // Cascade the thickness <select> to the new type.
                            wireBandThicknessSelect();
                        } finally {
                            setLoading(sw, false);
                        }
                    });
                    grid.appendChild(sw);
                });

                setFieldContent('band-type', grid);
                if (isHidden) {
                    setFieldValue('band-type', '—');
                    state.sel.bandType = null;
                } else {
                    setFieldValue('band-type', formatTagValue(state.currentBandType));
                    state.sel.bandType = formatTagValue(state.currentBandType);
                }

                // Level 2: thickness dropdown filtered by current type.
                wireBandThicknessSelect();
            }

            /* ============================================================
               MATERIAL CONFIGURATOR
               ============================================================ */
            function materialExists(variation) {
                if (!state.viewer || !variation) return false;
                let found = false;
                state.viewer.scene.traverse(obj => {
                    if (obj.isMesh) {
                        const n = obj.material?.name;
                        if (!n) return;
                        try { if (new RegExp(variation.uuid).test(n)) found = true; }
                        catch { if (n === variation.uuid) found = true; }
                    }
                });
                return found;
            }

            function classifyMaterials() {
                const plugin = state.materialPlugin;
                const mats = { gem: null, metalHead: null, metalShank: null, metalBand: null, metalGeneric: null };
                if (!plugin || !plugin.variations) return mats;

                plugin.variations.forEach((v, vi) => {
                    if (!materialExists(v)) return;
                    const options = plugin.options[vi] || [];
                    if (!options.length) return;
                    const role = materialRole(v.title || v.uuid);
                    const entry = { variation: v, variationIndex: vi, options };
                    if (role === 'gem' && !mats.gem) mats.gem = entry;
                    else if (role === 'metal-head' && !mats.metalHead) mats.metalHead = entry;
                    else if (role === 'metal-shank' && !mats.metalShank) mats.metalShank = entry;
                    else if (role === 'metal-band' && !mats.metalBand) mats.metalBand = entry;
                    else if (role === 'metal' && !mats.metalGeneric) mats.metalGeneric = entry;
                });
                return mats;
            }

            function renderGemType(matEntry) {
                if (!matEntry) {
                    setFieldEmpty('gem-type', 'Single gem material for this model');
                    return;
                }
                const { variation, options } = matEntry;
                const wrap = el('div', { class: 'color-grid' });
                options.forEach((opt, oi) => {
                    const label = opt.title || `${variation.title}-${oi + 1}`;
                    const isSel = variation.selectedIndex === oi;
                    const sw = el('div', { class: `color-swatch${isSel ? ' selected' : ''}`, title: label });
                    const ring = el('div', { class: 'color-swatch-ring' });
                    const dot = el('div', { class: `color-dot ${gemSwatchClass(label)}` });
                    if (opt.icon) {
                        const i = el('img', { src: opt.icon, alt: label });
                        i.onerror = () => i.remove();
                        dot.appendChild(i);
                    }
                    ring.appendChild(dot);
                    sw.appendChild(ring);
                    sw.appendChild(el('span', { class: 'color-label', text: label }));
                    sw.addEventListener('click', async () => {
                        if (sw.classList.contains('selected')) return;
                        setLoading(sw, true);
                        try {
                            await state.materialPlugin.applyVariation(variation, opt.uuid);
                            wrap.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                            sw.classList.add('selected');
                            setFieldValue('gem-type', label);
                            state.sel.gemType = label;

                        } finally {
                            setLoading(sw, false);
                        }
                    });
                    wrap.appendChild(sw);
                });
                setFieldContent('gem-type', wrap);
                const cur = options[variation.selectedIndex];
                const curLabel = cur ? (cur.title || `${variation.title}-${variation.selectedIndex + 1}`) : '—';
                setFieldValue('gem-type', curLabel);
                state.sel.gemType = curLabel;

            }

            function renderMetalColor(fieldName, matEntry, opts = {}) {
                if (!matEntry) {
                    setFieldEmpty(fieldName, opts.emptyMsg || 'Colour fixed for this part');
                    return;
                }
                const { variation, options } = matEntry;
                const wrap = el('div', { class: 'color-grid' });
