                options.forEach((opt, oi) => {
                    const label = opt.title || `${variation.title}-${oi + 1}`;
                    const isSel = variation.selectedIndex === oi;
                    const sw = el('div', { class: `color-swatch${isSel ? ' selected' : ''}`, title: label });
                    const ring = el('div', { class: 'color-swatch-ring' });
                    const cls = colorSwatchClass(label, variation.title);
                    const dot = el('div', { class: `color-dot ${cls}` });
                    const isMetal = cls.startsWith('material-swatch-');
                    // For metals, skip the plugin icon and let the
                    // catalog-spec linear-gradient `--metal-*` background
                    // show through (the gradient is the canonical disc art).
                    if (opt.icon && !isMetal) {
                        const i = el('img', { src: opt.icon, alt: label });
                        i.onerror = () => i.remove();
                        dot.appendChild(i);
                    } else if (!cls && opt.color) {
                        dot.style.background = opt.color;
                    }
                    ring.appendChild(dot);
                    sw.appendChild(ring);
                    sw.appendChild(el('span', { class: 'color-label', text: label }));
                    sw.addEventListener('click', async () => {
                        if (sw.classList.contains('selected')) return;
                        setLoading(sw, true);
                        try {
                            await state.materialPlugin.applyVariation(variation, opt.uuid);
                            wrap.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                            sw.classList.add('selected');
                            setFieldValue(fieldName, label);
                            if (fieldName === 'shank-color') state.sel.shankColor = label;

                            if (opts.mirrorField) {
                                setFieldValue(opts.mirrorField, label);
                                if (opts.mirrorField === 'shank-color') state.sel.shankColor = label;
                            }
                        } finally {
                            setLoading(sw, false);
                        }
                    });
                    wrap.appendChild(sw);
                });
                setFieldContent(fieldName, wrap);
                const cur = options[variation.selectedIndex];
                const curLabel = cur ? (cur.title || `${variation.title}-${variation.selectedIndex + 1}`) : '—';
                setFieldValue(fieldName, curLabel);
                if (fieldName === 'shank-color') state.sel.shankColor = curLabel;
            }

            // Render the Band Thickness dropdown using the same custom
            // dropdown component as the carat picker, so both fields share
            // a consistent look (matches the figma reference). Filtered to
            // the active band type when type tags are present so the list
            // matches the currently-selected band style.
            function wireBandThicknessSelect() {
                const host = document.getElementById('band-thickness-container');
                if (!host) return;

                const band = state.comps.band;
                if (!band) {
                    host.innerHTML = '';
                    host.appendChild(el('div', { class: 'field-empty', text: 'No band loaded' }));
                    state.bandThicknessDropdown = null;
                    return;
                }

                const cur = band.variations[band.selectedIndex];
                const curTags = cur ? parseTags(cur) : { type: null, size: null };
                const anyType = band.variations.some(v => parseTags(v).type);

                const sized = band.variations
                    .map(v => ({ v, tags: parseTags(v) }))
                    .filter(e => (!anyType || e.tags.type === curTags.type) && e.tags.size);

                if (!sized.length) {
                    host.innerHTML = '';
                    host.appendChild(el('div', { class: 'field-empty', text: 'No thickness options' }));
                    state.bandThicknessDropdown = null;
                    return;
                }

                const options = sized.map(e => ({
                    value:     e.tags.size,
                    label:     formatSizeLabel(e.tags.size),
                    variation: e.v
                }));
                const currentValue = options.some(o => o.value === curTags.size)
                    ? curTags.size : options[0].value;

                const onChange = async (val, opt) => {
                    const picked = opt && (opt.variation || opt._ref);
                    if (!picked) return;
                    state.bandThicknessDropdown?.setLoading(true);
                    markLoading(true);
                    try {
                        const wasHidden = band.visible === false;
                        await band.applyVariation(picked);
                        if (state.materialPlugin?.reapplyAll) await state.materialPlugin.reapplyAll();
                        alignRingAndBands();
                        if (wasHidden) setBandHidden(false, { skipAlign: true });
                        const pickedType = parseTags(picked).type;
                        if (pickedType) {
                            state.currentBandType = pickedType;
                            state.sel.bandType = formatTagValue(pickedType);
                        } else {
                            state.sel.bandType = variationLabel(picked);
                        }
                        setFieldValue('band-type', state.sel.bandType);
                        const grid = document.querySelector('.field[data-field="band-type"] .swatch-grid');
                        if (grid) {
                            const swatches = grid.querySelectorAll('.swatch');
                            const cascaded = swatches[0]?.hasAttribute('data-type');
                            if (cascaded) {
                                swatches.forEach(sw => {
                                    sw.classList.toggle('selected', sw.getAttribute('data-type') === pickedType);
                                });
                            } else {
                                swatches.forEach((sw, i) => {
                                    sw.classList.toggle('selected', i === band.selectedIndex);
                                });
                            }
                        }
                    } catch (e) {
                        console.warn('Band thickness apply failed', e);
                    } finally {
                        state.bandThicknessDropdown?.setLoading(false);
                        markLoading(false);
                    }
                };

                if (!state.bandThicknessDropdown) {
                    state.bandThicknessDropdown = window.createGemSizeDropdown({
                        options,
                        value: currentValue,
                        placeholder: 'Choose band thickness',
                        // Band sizes aren't carats — use the raw label and
                        // append "mm" via the unit slot.
                        labelMode: 'label',
                        unit: 'mm',
                        onChange
                    });
                    host.innerHTML = '';
                    host.appendChild(state.bandThicknessDropdown.element);
                } else {
                    state.bandThicknessDropdown.setOptions(options, { value: currentValue });
                }
            }

            /* ============================================================
               ORCHESTRATION
               ============================================================ */
            function classifyComponents(components) {
                const map = { head: null, shank: null, band: null };
                // Classify by role regardless of visibility — the band may load
                // hidden but we still need a handle to it (v3 parity).
                components.forEach(c => {
                    const role = ringCompRole(c.name);
                    if (role && !map[role]) map[role] = c;
                });
                return map;
            }

            function renderAll() {
                if (state.comps.head) {
                    renderHeadSection(state.comps.head);
                } else {
                    setFieldEmpty('head-type', 'No head component in this model');
                    setFieldEmpty('shape', 'No head component in this model');
                    setFieldEmpty('size', 'No carat size selector');
                }

                if (state.comps.shank) {
                    renderVariationSwatches('shank-type', state.comps.shank, {
                        onSelect: (v) => { state.sel.shankType = variationLabel(v);  }
                    });
                    const sel = state.comps.shank.variations[state.comps.shank.selectedIndex];
                    state.sel.shankType = sel ? variationLabel(sel) : null;
                } else {
                    setFieldEmpty('shank-type', 'Shank style fixed for this model');
                }

                if (state.comps.band) {
                    // Renders one swatch per `type:` tag (Upave / Plain /
                    // Pave / …) and cascades sizes into the Band thickness
                    // <select>. `setBandHidden` afterwards reflects the
                    // component's current visibility in the section UI.
                    renderBandSection(state.comps.band);
                    setBandHidden(state.comps.band.visible === false, { skipAlign: true });
                } else {
                    setFieldEmpty('band-type', 'Band style fixed for this model');
                }

                state.mats = classifyMaterials();

                renderGemType(state.mats.gem);

                const shankMat = state.mats.metalShank || state.mats.metalGeneric;
                renderMetalColor('shank-color', shankMat);

                // Plugin-driven native dropdown: ring/band width from band
                // `size:` tags. Carat is already plugin-driven via the custom
                // gem-size-dropdown component.
                wireBandThicknessSelect();


            }

            /* ============================================================
               VIEWER LOADER
               webgi + web-vto are already loaded by the static <script>
               tags above. We load the mini-viewer bundle (nowebgi
               variant — webgi is already on the page) dynamically here
               so its boot doesn't block initial paint. By the time this
               code runs, webgi globals are on `window`, so mini-viewer
               just hooks into them.
               ============================================================ */
            const loadScript = (src) => new Promise((res, rej) => {
                if (document.querySelector(`script[src="${src}"]`)) return res();
                const s = document.createElement('script');
                s.src = src; s.async = true; s.crossOrigin = 'anonymous';
                s.onload = res;
                s.onerror = () => rej(new Error('failed to load ' + src));
                document.body.appendChild(s);
            });

            (async () => {
                if (typeof window.webgi === 'undefined') {
                    console.error('webgi bundle did not load — check <script src> in <head>');
                    return;
                }
                try {
                    await loadScript('https://releases.ijewel3d.com/libs/mini-viewer/0.6.17/bundle.nowebgi.iife.js');
                } catch (e) {
                    console.error('Failed to load mini-viewer bundle', e);
                    return;
                }

                const params = new URLSearchParams(window.location.search);
                const driveBasename = params.get('drive') || 'drive-weur-1';
                const modelFileId = params.get('fileId') || 'QCJfUUa3SrGoiCokL1k82Q';

                ijewelViewer.loadModelById(
                    modelFileId,
                    driveBasename,
                    document.getElementById('viewer-container'),
                    {
                        showCard: false, showSwitchNode: false, splitMaterialTabs: true,
                        useIjewelLogo: false, hideQuality: true, logoScale: 1,
                        hideFullScreen: true, hideResetView: true, hideFitScene: true,
                        showLogo: false, hideRotateCamera: true, hideCameraViews: true,
                        hideGltfAnimations: true, transparentBg: false,
                        runRotateCamera: false, showConfigurator: false, showShare: false,
                        brandingSettings: { enable: false, showLoadingScreenLogo: false }
                    }
                );

                window.addEventListener('ijewel-viewer-ready', (e) => {
                    state.viewer = e.detail.viewer;

                    // Permanently suppress the animated hand-interaction prompt
                    // (v3 parity). Mirrors mini-editor's `enabled = false` flow.
                    const interactionPlugin = state.viewer.getPluginByType?.('InteractionPromptPlugin');
                    if (interactionPlugin) {
                        interactionPlugin.enabled = false;
                        try { interactionPlugin.stopAnimation?.({ reset: false }); } catch (_) {}
                    }

                    state.materialPlugin = state.viewer.getPluginByType('MaterialConfiguratorPlugin');

                    if (state.materialPlugin) {
                        const onMaterialUpdate = () => renderAll();
                        state.materialPlugin.addEventListener('deserialize', onMaterialUpdate);
                        state.materialPlugin.addEventListener('refreshUi', onMaterialUpdate);
                        state.viewer.scene.addEventListener('addSceneObject', onMaterialUpdate);
                    }

                    const ringPlugin = state.viewer.getPluginByType('RingConfigurator');
                    if (!ringPlugin) {
                        ['shape', 'size', 'gem-type', 'shank-type', 'shank-color', 'band-type']
                            .forEach(f => setFieldEmpty(f, 'Ring builder plugin not available'));
                        return;
                    }

                    ringPlugin.addEventListener('componentProcessed', () => {
                        state.ringPlugin = ringPlugin;
                        state.ringComponents = ringPlugin.components || [];
                        state.comps = classifyComponents(state.ringComponents);

                        // Force-hide the band on the FIRST load only so it
                        // doesn't appear until the user explicitly clicks a
                        // band swatch. Subsequent renders respect whatever the
                        // user toggled to via the swatch.
                        if (!state.bandInitialized && state.comps.band) {
                            try { state.comps.band.setVisible(false); } catch (_) {}
                            state.bandInitialized = true;
                        }

                        renderAll();
                        requestAnimationFrame(() => alignRingAndBands());
                    });
                });
            })();
        })();
    </script>
</body>

</html>
